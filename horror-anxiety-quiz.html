<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深淵回聲 — 內心焦慮測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --void:#04020a;--abyss:#080410;--deep:#0d0820;
  --blood:#8b1a1a;--crimson:#c0392b;--scarlet:#e74c3c;--ember:#ff6b35;
  --bone:#d4c9b8;--pale:#c8b8b0;--ash:#9a8a7a;--dust:#6a5a4a;
  --glow-red:rgba(192,57,43,.4);--glow-dim:rgba(140,20,20,.2);
}
body{background:var(--void);color:var(--bone);font-family:'Noto Serif TC',Georgia,serif;min-height:100vh;overflow-x:hidden;cursor:crosshair;}
.wrap{position:relative;z-index:10;max-width:700px;margin:0 auto;padding:3rem 1.5rem 8rem;}
.site-header{text-align:center;margin-bottom:4rem;padding-top:1rem;}
.horror-eye{font-size:3.5rem;display:block;margin:0 auto 1.2rem;animation:eyeFloat 4s ease-in-out infinite;filter:drop-shadow(0 0 20px var(--crimson));}
@keyframes eyeFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-10px) scale(1.05);}}
.site-title{font-family:'Cinzel',serif;font-size:2.2rem;font-weight:700;color:var(--bone);letter-spacing:.12em;line-height:1.3;margin-bottom:.6rem;text-shadow:0 0 40px var(--glow-red),0 2px 4px rgba(0,0,0,.8);}
.site-title em{color:var(--scarlet);font-style:normal;text-shadow:0 0 20px var(--scarlet);}
.site-sub{font-family:'Crimson Text',serif;font-size:1rem;color:var(--ash);letter-spacing:.1em;font-style:italic;margin-top:.4rem;}
.title-line{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--blood),transparent);margin:1.2rem auto;}
#landing{text-align:center;}
.lore-box{background:rgba(10,4,8,.8);border:1px solid #1e0808;border-radius:8px;padding:2rem 2.2rem;margin:2rem 0;position:relative;box-shadow:0 0 60px rgba(80,0,0,.15),inset 0 0 40px rgba(0,0,0,.3);}
.lore-text{font-family:'Crimson Text',serif;font-size:1.12rem;color:var(--pale);line-height:2;}
.lore-text em{color:var(--scarlet);font-style:italic;}
.warning-row{display:flex;align-items:center;gap:.8rem;justify-content:center;font-size:.72rem;color:var(--dust);letter-spacing:.15em;margin-top:1.5rem;}
.warning-dot{width:6px;height:6px;border-radius:50%;background:var(--blood);animation:warnBlink 1.5s ease-in-out infinite;}
@keyframes warnBlink{0%,100%{opacity:.4}50%{opacity:1;box-shadow:0 0 8px var(--crimson)}}
.start-btn{display:inline-block;margin-top:2.5rem;background:transparent;border:1px solid var(--blood);border-radius:4px;color:var(--bone);font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.2em;padding:1rem 3rem;cursor:pointer;position:relative;overflow:hidden;transition:all .4s;}
.start-btn:hover{border-color:var(--scarlet);color:#fff;box-shadow:0 0 30px var(--glow-red),0 0 60px rgba(100,0,0,.2);}
.quiz-section{display:none;}
.quiz-section.active{display:block;}
.qcard{background:rgba(8,4,12,.85);border:1px solid #1e0808;border-radius:8px;padding:2.5rem 2rem 2rem;margin-bottom:1.5rem;position:relative;overflow:hidden;}
.qnum{font-size:.6rem;color:#5a2020;letter-spacing:.25em;margin-bottom:.8rem;font-family:'Cinzel',serif;}
.qtext{font-family:'Crimson Text',serif;font-size:1.25rem;color:var(--pale);line-height:1.85;margin-bottom:1.8rem;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{background:rgba(12,4,8,.7);border:1px solid #1e0606;border-radius:6px;padding:.9rem 1.2rem;color:var(--dust);font-family:'Noto Serif TC',serif;font-size:.97rem;cursor:pointer;text-align:left;transition:all .25s;display:flex;align-items:center;gap:12px;}
.opt:hover{border-color:#5a0a0a;color:var(--pale);transform:translateX(5px);}
.opt.sel{background:rgba(80,10,10,.35);border-color:var(--crimson);color:var(--bone);}
.osym{width:24px;height:24px;min-width:24px;border:1px solid #2a1010;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#4a2020;font-family:'Cinzel',serif;}
.opt.sel .osym{background:var(--blood);color:var(--bone);border-color:var(--crimson);}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:.8rem;}
.nbtn{background:transparent;border:1px solid #1e0606;border-radius:4px;color:#3a1010;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.15em;padding:.65rem 1.6rem;cursor:pointer;transition:all .25s;}
.nbtn:hover:not(:disabled){border-color:var(--blood);color:var(--crimson);}
.nbtn.pri{background:rgba(80,10,10,.2);border-color:var(--blood);color:var(--crimson);}
.nbtn.pri:hover{background:rgba(80,10,10,.4);border-color:var(--scarlet);}
.nbtn:disabled{opacity:.2;cursor:default;}
.rcard{display:none;background:rgba(6,2,10,.92);border:1px solid #1e0808;border-radius:8px;padding:3rem 2rem;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(100,0,0,.2);}
.r-icon{font-size:3.5rem;display:block;text-align:center;margin-bottom:1.5rem;}
.r-lbl{font-size:.6rem;color:#4a1a1a;letter-spacing:.3em;text-align:center;margin-bottom:.5rem;font-family:'Cinzel',serif;}
.r-type{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:700;color:var(--scarlet);text-align:center;margin-bottom:.4rem;text-shadow:0 0 30px var(--glow-red);}
.r-name{font-family:'Crimson Text',serif;font-size:1.15rem;color:var(--bone);text-align:center;font-style:italic;margin-bottom:.3rem;}
.r-divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,#2a0808,transparent);margin:1.5rem auto;}
.r-desc{font-family:'Crimson Text',serif;font-size:1.08rem;color:var(--ash);line-height:1.95;border-left:1px solid #2a0808;padding-left:1.3rem;margin-bottom:1.5rem;}
.r-tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem;}
.r-tag{background:rgba(80,10,10,.12);border:1px solid #2a0808;border-radius:3px;padding:4px 14px;font-size:.8rem;color:#7a4040;font-family:'Cinzel',serif;}
.r-advice{background:rgba(10,4,6,.8);border:1px solid #1e0808;border-radius:6px;padding:1.3rem 1.5rem;margin-bottom:1.5rem;}
.r-advice-lbl{font-size:.58rem;color:#4a1a1a;letter-spacing:.25em;margin-bottom:.6rem;font-family:'Cinzel',serif;}
.r-advice-text{font-family:'Crimson Text',serif;font-size:1rem;color:var(--ash);line-height:1.75;font-style:italic;}
.restart-btn{background:transparent;border:1px solid #1e0808;border-radius:4px;color:#3a1010;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.15em;padding:.7rem 2rem;cursor:pointer;transition:all .25s;display:block;margin:0 auto;}
.restart-btn:hover{border-color:var(--blood);color:var(--crimson);box-shadow:0 0 20px rgba(100,0,0,.2);}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <span class="horror-eye">🩸</span>
    <h1 class="site-title">深淵<em>回聲</em></h1>
    <div class="title-line"></div>
    <p class="site-sub">內心焦慮深度測驗 · 你的恐懼是什麼形狀的？</p>
  </header>

  <section id="landing" class="quiz-section active">
    <div class="lore-box">
      <p class="lore-text">
        在你靈魂最深處，<em>有某種東西</em>住了很久。<br>
        它在你睡不著的夜晚低語，<br>
        在人群中讓你感到格外孤獨，<br>
        在每個「我還好」背後，無聲嘶吼。<br><br>
        這個測驗不會讓它消失——<br>
        但它會幫你<em>看清它的臉</em>。
      </p>
    </div>
    <div class="warning-row">
      <div class="warning-dot"></div>
      <span>共 10 題 · 無對錯之分 · 請憑本能回答</span>
      <div class="warning-dot"></div>
    </div>
    <div style="text-align:center">
      <button class="start-btn" onclick="startQuiz()">凝視深淵 → </button>
    </div>
  </section>

  <section id="quiz-section" class="quiz-section">
    <div class="qcard" id="qcard">
      <div class="qnum" id="qnum">QUESTION Ⅰ</div>
      <div class="qtext" id="qtext"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="nav">
      <button class="nbtn" id="pbtn" onclick="prevQ()" disabled>← 退回</button>
      <button class="nbtn pri" id="nbtn" onclick="nextQ()">繼續 →</button>
    </div>
    <div class="rcard" id="rcard">
      <span class="r-icon" id="r-icon">🩸</span>
      <div class="r-lbl">你的焦慮類型</div>
      <div class="r-type" id="r-type"></div>
      <div class="r-name" id="r-name"></div>
      <div class="r-divider"></div>
      <div class="r-desc" id="r-desc"></div>
      <div class="r-tags" id="r-tags"></div>
      <div class="r-advice">
        <div class="r-advice-lbl">深淵給你的話</div>
        <div class="r-advice-text" id="r-advice"></div>
      </div>
      <button class="restart-btn" onclick="restartQuiz()">再度凝視深淵</button>
    </div>
  </section>
</div>

<script>
const QS=[{q:"深夜突然清醒，你腦中第一個出現的念頭是……",opts:[{t:"我明天還有好多事沒做完",v:"control"},{t:"不知道那個人有沒有在生我的氣",v:"attach"},{t:"什麼都沒有，只是一種說不清的不安",v:"exist"},{t:"我這樣下去到底算什麼",v:"worth"}]},{q:"有人沒有回你訊息，過了兩個小時，你的狀態是……",opts:[{t:"開始想是不是自己說錯了什麼",v:"attach"},{t:"沒差，反正我也在忙",v:"detach"},{t:"隱約覺得自己又被拋棄了",v:"attach"},{t:"在腦中把所有可能的原因排列一遍",v:"control"}]},{q:"有人稱讚你，你的第一反應是……",opts:[{t:"開始懷疑他是不是有什麼目的",v:"worth"},{t:"謝謝，但心裡覺得自己不太配",v:"worth"},{t:"接受，但等著看後來會不會被推翻",v:"attach"},{t:"無感，反正一個稱讚說明不了什麼",v:"detach"}]},{q:"你在一個派對或聚會上，人很多，你通常……",opts:[{t:"找一個角落讓自己看起來很忙",v:"exist"},{t:"努力融入，但其實一直在觀察別人怎麼看我",v:"attach"},{t:"很快抽離，回家後才覺得可以呼吸",v:"exist"},{t:"想離開但覺得離開了別人會有想法",v:"attach"}]},{q:"想像一個你非常在意的人突然說『我們需要談談』你的身體反應是……",opts:[{t:"胃往下沉，開始默默列出自己的罪狀",v:"worth"},{t:"心跳加速，腦中瞬間預演所有最壞的情況",v:"control"},{t:"感覺有什麼東西要碎掉了",v:"attach"},{t:"表面鎮定，內心是一片白色的空洞",v:"detach"}]},{q:"當你獨處的時候，你最常感受到的是……",opts:[{t:"一種莫名的空虛，不知道自己在等什麼",v:"exist"},{t:"如釋重負，終於不用再表演了",v:"detach"},{t:"腦子停不下來，想東想西",v:"control"},{t:"隱約的恐懼，不知道恐懼什麼",v:"exist"}]},{q:"你做了一個重要的決定，但朋友提出了反對意見，你……",opts:[{t:"開始動搖，覺得也許自己真的錯了",v:"worth"},{t:"表面接受，內心還是照原計畫走",v:"detach"},{t:"一直想那句話，反覆咀嚼到天亮",v:"control"},{t:"試著解釋，但越解釋越覺得沒有人真的懂我",v:"exist"}]},{q:"最能描述你對『未來』的感覺的畫面是……",opts:[{t:"一條霧裡的路，走不快也不敢停",v:"exist"},{t:"一份不斷在更新的待辦清單，永遠清不完",v:"control"},{t:"一個你追著但靠近不了的背影",v:"attach"},{t:"一個空白的房間，你站在裡面，什麼都不是",v:"worth"}]},{q:"你最難說出口的一句話是……",opts:[{t:"『我需要幫忙。』",v:"worth"},{t:"『我很害怕。』",v:"detach"},{t:"『請不要離開我。』",v:"attach"},{t:"『我不知道自己是誰。』",v:"exist"}]},{q:"凌晨三點，你在想的是……",opts:[{t:"那件事我到底做對了嗎，我還能補救嗎",v:"control"},{t:"有沒有人真的在乎我，還是我只是方便的存在",v:"attach"},{t:"我到底為什麼活著，這樣活著有什麼意思",v:"exist"},{t:"我是不是從來都不夠好，一直在勉強撐著",v:"worth"}]}];const TYPES={control:{label:"掌控型焦慮",name:"你是那個永遠在備份的人",icon:"⚙️",desc:"你的焦慮長得像一張永遠寫不完的清單。",tags:["過度思慮","完美主義傾向","難以放鬆","對意外極度敏感"],advice:"你的大腦從不休息，因為它以為只要想得夠周全，就能阻止任何壞事發生。"},attach:{label:"依附型焦慮",name:"你把別人的回應當作呼吸",icon:"🩷",desc:"對你來說，關係是氧氣，也是刀。",tags:["害怕被拋棄","高度依附","敏感於情緒變化","過度解讀訊號"],advice:"你花了太多力氣去確認別人是否還在。"},exist:{label:"存在型焦慮",name:"你在霧裡走路，不知道去哪",icon:"🌫️",desc:"你的焦慮沒有具體的臉，它是一種漂浮感。",tags:["意義感缺失","虛無感","與現實的疏離","對未來的茫然"],advice:"霧不會永遠這麼濃。"},worth:{label:"自我價值型焦慮",name:"你是最嚴苛的那個審判者",icon:"🪞",desc:"無論外面的人怎麼說，你心裡那個聲音永遠更大、更毒。",tags:["低自我價值感","冒牌者症候群","渴望認可","難以接受讚美"],advice:"那個說你不夠好的聲音，不是事實——它是傷。"},detach:{label:"解離型焦慮",name:"你把感覺鎖起來，自己找不到鑰匙",icon:"🧊",desc:"你看起來很冷靜，甚至有點冷漠。",tags:["情感麻木","高功能焦慮","與情緒的解離","過度獨立"],advice:"鎖住感覺，是當時最好的選擇——它讓你活下來了。"}};let cur=0,answers=new Array(QS.length).fill(null);const ROMAN=["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ","Ⅸ","Ⅹ"];function startQuiz(){cur=0;answers=new Array(QS.length).fill(null);document.getElementById('landing').classList.remove('active');document.getElementById('quiz-section').classList.add('active');render();}function render(){const q=QS[cur];document.getElementById('qnum').textContent=`QUESTION ${ROMAN[cur]}`;document.getElementById('qtext').textContent=q.q;const opts=document.getElementById('opts');opts.innerHTML='';q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(answers[cur]===i?' sel':'');b.innerHTML=`<span class="osym">${ROMAN[i]}</span>${o.t}`;b.onclick=()=>{answers[cur]=i;render();};opts.appendChild(b);});document.getElementById('pbtn').disabled=cur===0;document.getElementById('nbtn').textContent=cur===QS.length-1?'窺見深淵 →':'繼續 →';}function nextQ(){if(answers[cur]===null)return;if(cur<QS.length-1){cur++;render();}else showResult();}function prevQ(){if(cur>0){cur--;render();}}function showResult(){const scores={control:0,attach:0,exist:0,worth:0,detach:0};QS.forEach((q,qi)=>{if(answers[qi]===null)return;scores[q.opts[answers[qi]].v]++;});const winner=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];const r=TYPES[winner];document.getElementById('qcard').style.display='none';document.querySelector('#quiz-section .nav').style.display='none';document.getElementById('rcard').style.display='block';document.getElementById('r-icon').textContent=r.icon;document.getElementById('r-type').textContent=r.label;document.getElementById('r-name').textContent=r.name;document.getElementById('r-desc').textContent=r.desc;document.getElementById('r-tags').innerHTML=r.tags.map(t=>`<span class="r-tag">${t}</span>`).join('');document.getElementById('r-advice').textContent=r.advice;}function restartQuiz(){cur=0;answers=new Array(QS.length).fill(null);document.getElementById('rcard').style.display='none';document.getElementById('qcard').style.display='block';document.querySelector('#quiz-section .nav').style.display='flex';render();window.scrollTo({top:0,behavior:'smooth'});}
</script>
</body>
</html>
