<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深淵回聲 — 內心焦慮測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --void:#04020a;--abyss:#080410;--deep:#0d0820;
  --blood:#8b1a1a;--crimson:#c0392b;--scarlet:#e74c3c;--ember:#ff6b35;
  --bone:#d4c9b8;--pale:#c8b8b0;--ash:#9a8a7a;--dust:#6a5a4a;
  --glow-red:rgba(192,57,43,.4);--glow-dim:rgba(140,20,20,.2);
  --horror-red:#cc0000;--horror-dark:#1a0000;
}

/* ── Scanline + film grain overlay ── */
body{
  background:var(--void);
  color:var(--bone);
  font-family:'Noto Serif TC',Georgia,serif;
  min-height:100vh;
  overflow-x:hidden;
  cursor:crosshair;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);
  animation:scanMove 8s linear infinite;
}
@keyframes scanMove{from{background-position:0 0}to{background-position:0 200px}}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:998;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  opacity:.8;
}

/* ── Blood vignette ── */
.vignette{position:fixed;inset:0;pointer-events:none;z-index:997;
  background:radial-gradient(ellipse at center,transparent 0%,rgba(20,0,0,.3) 100%);
}

/* ── Ambient blood veins ── */
.veins{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.vein{
  position:absolute;border-radius:9999px;
  background:linear-gradient(var(--blood),transparent);
  opacity:0;animation:veinPulse var(--d,8s) ease-in-out infinite var(--delay,0s);
  box-shadow:0 0 8px var(--crimson);
}
@keyframes veinPulse{0%,100%{opacity:0}50%{opacity:.18}}

/* ── Floating particles ── */
.particles{position:fixed;inset:0;pointer-events:none;z-index:2;}
.particle{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,var(--scarlet),transparent);
  animation:particleDrift var(--pd,10s) ease-in-out infinite var(--pdelay,0s);
  box-shadow:0 0 20px var(--crimson),0 0 40px rgba(200,57,43,.2);
}
@keyframes particleDrift{
  0%,100%{transform:translateY(0) scale(1);opacity:0}
  50%{transform:translateY(-80px) scale(1.4);opacity:.2}
}

/* ── Blood drip corners ── */
.drip-corner{position:fixed;pointer-events:none;z-index:3;}
.drip-corner.tl{top:0;left:0;}
.drip-corner.tr{top:0;right:0;transform:scaleX(-1);}

/* ── Horror distortion ── */
.distort-zone{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;}
@keyframes distortPulse{
  0%,100%{opacity:0;filter:none}
  50%{opacity:0.02;filter:url(#distortion)}
}

/* ── Main layout ── */
.wrap{
  position:relative;z-index:10;
  max-width:700px;margin:0 auto;
  padding:3rem 1.5rem 8rem;
}

/* ── Header ── */
.site-header{text-align:center;margin-bottom:4rem;padding-top:1rem;}
.horror-eye{
  font-size:4rem;display:block;
  margin:0 auto 1.2rem;
  animation:eyeFloat 3.5s ease-in-out infinite, eyeTwitch 0.15s ease-in-out 0.5s infinite;
  filter:drop-shadow(0 0 30px var(--horror-red)) drop-shadow(0 0 60px rgba(200,0,0,.3));
}
@keyframes eyeFloat{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-15px) scale(1.1);}
}
@keyframes eyeTwitch{
  0%,100%{transform:skewX(0deg);}
  50%{transform:skewX(1deg);}
}
.site-title{
  font-family:'Cinzel',serif;
  font-size:2.5rem;font-weight:700;
  color:var(--bone);
  letter-spacing:.15em;
  line-height:1.3;
  margin-bottom:.6rem;
  text-shadow:0 0 60px var(--horror-red),0 0 30px rgba(200,0,0,.5),0 4px 8px rgba(0,0,0,.9);
  animation:titleFlickerHeavy 5s ease-in-out infinite;
  position:relative;
}
@keyframes titleFlickerHeavy{
  0%,100%{opacity:1;text-shadow:0 0 60px var(--horror-red),0 0 30px rgba(200,0,0,.5),0 4px 8px rgba(0,0,0,.9)}
  88%{opacity:1;text-shadow:0 0 60px var(--horror-red),0 0 30px rgba(200,0,0,.5),0 4px 8px rgba(0,0,0,.9)}
  89%{opacity:.4;text-shadow:0 0 20px rgba(200,0,0,.3),0 2px 4px rgba(0,0,0,.8)}
  91%{opacity:1;text-shadow:0 0 60px var(--horror-red),0 0 30px rgba(200,0,0,.5),0 4px 8px rgba(0,0,0,.9)}
  93%{opacity:.3;text-shadow:0 0 40px var(--horror-red)}
  95%{opacity:1;text-shadow:0 0 60px var(--horror-red),0 0 30px rgba(200,0,0,.5),0 4px 8px rgba(0,0,0,.9)}
}
.site-title em{color:var(--horror-red);font-style:normal;text-shadow:0 0 30px var(--horror-red),0 0 15px rgba(200,0,0,.6);}
.site-sub{
  font-family:'Crimson Text',serif;font-size:1.1rem;
  color:#8a6a6a;letter-spacing:.12em;font-style:italic;
  margin-top:.4rem;
  text-shadow:0 0 10px rgba(200,0,0,.2);
  animation:subFlicker 7s ease-in-out infinite;
}
@keyframes subFlicker{
  0%,100%{opacity:0.8}
  50%{opacity:1}
}
.title-line{
  width:100px;height:2px;
  background:linear-gradient(90deg,transparent,var(--horror-red),transparent);
  margin:1.2rem auto;
  box-shadow:0 0 15px var(--horror-red);
}

/* ── Landing page ── */
#landing{text-align:center;}
.lore-box{
  background:rgba(6,2,8,.95);
  border:2px solid #3a0808;
  border-radius:8px;
  padding:2.5rem 2.5rem;
  margin:2rem 0;
  position:relative;
  box-shadow:0 0 80px rgba(140,0,0,.25),inset 0 0 60px rgba(0,0,0,.5),0 0 40px var(--horror-red);
  animation:lureMoves 8s ease-in-out infinite;
}
@keyframes lureMoves{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
.lore-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--horror-red),transparent);
  box-shadow:0 0 20px var(--horror-red);
}
.lore-box::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,0,0,.5),transparent);
}
.lore-text{
  font-family:'Crimson Text',serif;font-size:1.2rem;
  color:var(--pale);line-height:2.2;
}
.lore-text em{color:var(--horror-red);font-style:italic;text-shadow:0 0 15px var(--horror-red);}
.warning-row{
  display:flex;align-items:center;gap:1rem;justify-content:center;
  font-size:.8rem;color:#7a5a5a;letter-spacing:.18em;margin-top:2rem;
}
.warning-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--horror-red);
  animation:warnBlinkHeavy 1.2s ease-in-out infinite;
  box-shadow:0 0 8px var(--horror-red);
}
@keyframes warnBlinkHeavy{0%,100%{opacity:.3;box-shadow:0 0 4px var(--horror-red)}50%{opacity:1;box-shadow:0 0 16px var(--horror-red),0 0 32px rgba(200,0,0,.3)}}
.start-btn{
  display:inline-block;
  margin-top:3rem;
  background:rgba(80,10,10,.15);
  border:2px solid var(--horror-red);
  border-radius:4px;
  color:var(--bone);
  font-family:'Cinzel',serif;
  font-size:1rem;letter-spacing:.3em;
  padding:1.2rem 3.5rem;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all .4s;
  text-shadow:0 0 15px rgba(200,0,0,.4);
  box-shadow:0 0 20px var(--horror-red),inset 0 0 20px rgba(200,0,0,.1);
}
.start-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(200,26,26,.3));
  transition:opacity .4s;
}
.start-btn::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--horror-red),transparent);
  transform:scaleX(0);transition:transform .4s;
  box-shadow:0 0 15px var(--horror-red);
}
.start-btn:hover{
  border-color:var(--horror-red);
  color:#fff;
  box-shadow:0 0 50px var(--horror-red),0 0 80px rgba(200,0,0,.3),inset 0 0 30px rgba(200,0,0,.2);
  text-shadow:0 0 25px var(--horror-red);
  transform:scale(1.05);
}
.start-btn:hover::after{transform:scaleX(1);}
.start-btn:active{
  transform:scale(0.98);
  box-shadow:0 0 30px var(--horror-red),0 0 60px rgba(200,0,0,.2);
}

/* ── Section / Step ── */
.quiz-section{display:none;}
.quiz-section.active{display:block;animation:fadeInDark .6s ease;}
@keyframes fadeInDark{from{opacity:0;transform:translateY(20px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}

/* ── Sticky topbar ── */
.topbar{
  display:none;position:sticky;top:0;z-index:100;
  background:rgba(4,2,10,.98);border-bottom:2px solid #2a0808;
  backdrop-filter:blur(15px);
  padding:.9rem 1.5rem;margin:-3rem -1.5rem 2rem;
  box-shadow:0 0 30px rgba(140,0,0,.2);
}
.topbar.visible{display:flex;animation:topbarSlide 0.4s ease;}
@keyframes topbarSlide{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.topbar-inner{max-width:700px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;}
.topbar-home{
  display:flex;align-items:center;gap:8px;
  background:transparent;border:1px solid #3a0808;border-radius:4px;
  color:#6a4a4a;font-family:'Noto Serif TC',serif;
  font-size:.7rem;letter-spacing:.15em;padding:.5rem 1rem;cursor:pointer;transition:all .3s;
}
.topbar-home:hover{border-color:var(--horror-red);color:var(--horror-red);box-shadow:0 0 15px var(--horror-red);}
.topbar-title{font-size:.65rem;color:#5a2a2a;letter-spacing:.18em;text-shadow:0 0 10px rgba(200,0,0,.2);}

/* ── Progress ── */
.step-lbl{font-size:.68rem;color:#5a2a2a;letter-spacing:.25em;text-align:center;margin-bottom:.6rem;font-family:'Cinzel',serif;text-transform:uppercase;text-shadow:0 0 10px rgba(200,0,0,.15);}
.prog-bar{width:100%;height:3px;background:#0a0204;border-radius:2px;margin-bottom:2.5rem;overflow:hidden;box-shadow:inset 0 0 10px rgba(0,0,0,.8);}
.prog-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.34,.1,.68,.55);background:linear-gradient(90deg,#6a0a0a,var(--horror-red),var(--ember),#ff4500);box-shadow:0 0 15px var(--horror-red),inset 0 0 8px rgba(255,255,255,.1);}

/* ── Question card ── */
.qcard{
  background:rgba(6,2,10,.9);
  border:2px solid #2a0808;
  border-radius:8px;
  padding:3rem 2.5rem 2.5rem;
  margin-bottom:2rem;
  position:relative;overflow:hidden;
  box-shadow:0 0 70px rgba(140,0,0,.2),inset 0 0 50px rgba(0,0,0,.6),0 0 30px var(--horror-red);
  animation:cardPulse 6s ease-in-out infinite;
}
@keyframes cardPulse{
  0%,100%{box-shadow:0 0 70px rgba(140,0,0,.2),inset 0 0 50px rgba(0,0,0,.6),0 0 30px var(--horror-red)}
  50%{box-shadow:0 0 90px rgba(140,0,0,.35),inset 0 0 60px rgba(0,0,0,.5),0 0 50px var(--horror-red)}
}
.qcard::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#6a0808,var(--horror-red),#6a0808,transparent);
  box-shadow:0 0 20px var(--horror-red);
}
.qcard::after{
  content:'';position:absolute;bottom:0;right:0;
  width:140px;height:140px;
  background:radial-gradient(circle,rgba(200,26,26,.15),transparent);
  pointer-events:none;
  filter:blur(20px);
}
.qnum{font-size:.65rem;color:#6a3030;letter-spacing:.3em;margin-bottom:1rem;font-family:'Cinzel',serif;text-transform:uppercase;text-shadow:0 0 10px rgba(200,0,0,.2);}
.qtext{
  font-family:'Crimson Text',serif;font-size:1.35rem;
  color:var(--pale);line-height:2;margin-bottom:2rem;
  text-shadow:0 0 5px rgba(0,0,0,.5);
}

/* ── Options ── */
.opts{display:flex;flex-direction:column;gap:12px;}
.opt{
  background:rgba(8,2,10,.8);border:1.5px solid #1e0606;
  border-radius:6px;padding:1.1rem 1.5rem;
  color:#8a6a6a;font-family:'Noto Serif TC',serif;font-size:1rem;
  cursor:pointer;text-align:left;
  transition:all .3s cubic-bezier(.34,.1,.68,.55);
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
}
.opt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(200,10,10,.25),transparent);transition:width .4s;}
.opt::after{content:'';position:absolute;inset:0;opacity:0;background:radial-gradient(circle at center,rgba(200,26,26,.1),transparent);transition:opacity .3s;pointer-events:none;}
.opt:hover{
  border-color:#6a1a1a;color:var(--pale);
  transform:translateX(8px);
  box-shadow:0 0 20px rgba(200,0,0,.25),inset 0 0 10px rgba(200,0,0,.1);
}
.opt:hover::before{width:100%;}
.opt:hover::after{opacity:1;}
.opt.sel{
  background:rgba(120,15,15,.45);
  border-color:var(--horror-red);
  color:var(--bone);
  box-shadow:0 0 30px var(--horror-red),inset 0 0 20px rgba(200,0,0,.2);
  transform:translateX(8px);
}
.opt.sel::before{width:100%;}
.osym{
  width:28px;height:28px;min-width:28px;
  border:1.5px solid #3a1a1a;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:#5a2a2a;font-family:'Cinzel',serif;
  transition:all .3s;
  background:rgba(0,0,0,.4);
}
.opt.sel .osym{
  background:var(--horror-red);
  color:var(--bone);
  border-color:var(--horror-red);
  box-shadow:0 0 15px var(--horror-red),inset 0 0 8px rgba(255,255,255,.2);
  transform:scale(1.1);
}

/* ── Nav buttons ── */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:1.5rem;}
.nbtn{
  background:rgba(10,4,8,.6);border:1.5px solid #1e0606;
  border-radius:4px;color:#5a3a3a;
  font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.18em;
  padding:.8rem 2rem;cursor:pointer;transition:all .3s;
  text-transform:uppercase;
  box-shadow:0 0 10px rgba(0,0,0,.4);
}
.nbtn:hover:not(:disabled){
  border-color:var(--horror-red);
  color:var(--horror-red);
  box-shadow:0 0 20px var(--horror-red),0 0 40px rgba(200,0,0,.15);
}
.nbtn.pri{
  background:rgba(120,15,15,.3);
  border-color:var(--horror-red);
  color:var(--horror-red);
  box-shadow:0 0 15px var(--horror-red);
}
.nbtn.pri:hover{
  background:rgba(120,15,15,.5);
  border-color:var(--horror-red);
  color:#fff;
  box-shadow:0 0 30px var(--horror-red),0 0 60px rgba(200,0,0,.2);
}
.nbtn:disabled{opacity:.15;cursor:default;text-shadow:none;}

/* ── Result card ── */
.rcard{
  display:none;
  background:rgba(4,0,8,.95);border:2px solid #2a0808;
  border-radius:8px;padding:3.5rem 2.5rem;
  position:relative;overflow:hidden;
  box-shadow:0 0 100px rgba(140,0,0,.3),inset 0 0 80px rgba(0,0,0,.7);
  animation:resultAppear 0.8s cubic-bezier(.34,1.56,.64,1);
}
@keyframes resultAppear{
  0%{opacity:0;transform:translateY(40px) scale(0.95);filter:blur(10px)}
  70%{opacity:1;transform:translateY(-5px) scale(1.02)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
.rcard::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--horror-red),transparent);
  box-shadow:0 0 25px var(--horror-red);
}
.rcard::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,0,0,.4),transparent);
}
.r-icon{
  font-size:4.5rem;display:block;text-align:center;margin-bottom:1.5rem;
  animation:iconPulseHeavy 2s ease-in-out infinite;
  filter:drop-shadow(0 0 25px var(--horror-red)) drop-shadow(0 0 50px rgba(200,0,0,.3));
}
@keyframes iconPulseHeavy{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 25px var(--horror-red))}
  50%{transform:scale(1.15);filter:drop-shadow(0 0 40px var(--horror-red)) drop-shadow(0 0 80px rgba(200,0,0,.3))}
}
.r-lbl{font-size:.7rem;color:#6a3030;letter-spacing:.35em;text-align:center;margin-bottom:.6rem;font-family:'Cinzel',serif;text-transform:uppercase;text-shadow:0 0 10px rgba(200,0,0,.2);}
.r-type{
  font-family:'Cinzel',serif;font-size:2rem;font-weight:700;
  color:var(--horror-red);text-align:center;margin-bottom:.5rem;
  text-shadow:0 0 40px var(--horror-red),0 0 20px rgba(200,0,0,.5);
  letter-spacing:.1em;
  animation:typeGlowHeavy 2.5s ease-in-out infinite;
}
@keyframes typeGlowHeavy{
  0%,100%{text-shadow:0 0 40px var(--horror-red),0 0 20px rgba(200,0,0,.5)}
  50%{text-shadow:0 0 60px var(--horror-red),0 0 30px rgba(200,0,0,.7),0 0 100px rgba(200,0,0,.2)}
}
.r-name{font-family:'Crimson Text',serif;font-size:1.3rem;color:var(--bone);text-align:center;font-style:italic;margin-bottom:.5rem;text-shadow:0 0 5px rgba(0,0,0,.5);}
.r-divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,#3a0808,transparent);margin:2rem auto;box-shadow:0 0 15px rgba(200,0,0,.2);}

/* ── Score bar ── */
.score-wrap{margin:2rem 0;}
.score-lbl{display:flex;justify-content:space-between;font-size:.68rem;color:#6a3030;letter-spacing:.15em;margin-bottom:.6rem;text-transform:uppercase;}
.score-lbl .hi{color:var(--horror-red);font-weight:700;text-shadow:0 0 10px var(--horror-red);}
.score-bg{width:100%;height:8px;background:#0a0204;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 10px rgba(0,0,0,.8);}
.score-fill{
  height:100%;border-radius:4px;
  transition:width 1.6s cubic-bezier(.22,1,.36,1) .6s;
  background:linear-gradient(90deg,#4a0404,var(--horror-red),var(--horror-red),var(--ember),#ff6b35);
  box-shadow:0 0 15px var(--horror-red),inset 0 0 8px rgba(255,255,255,.15);
}

/* ── Result description ── */
.r-desc{
  font-family:'Crimson Text',serif;font-size:1.15rem;
  color:#9a8a7a;line-height:2;
  border-left:2px solid #3a0808;padding-left:1.5rem;
  margin-bottom:2rem;
  text-shadow:0 0 5px rgba(0,0,0,.5);
}
.r-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:2rem;}
.r-tag{
  background:rgba(140,15,15,.18);border:1px solid #3a0808;
  border-radius:4px;padding:6px 16px;
  font-size:.85rem;color:#8a5a5a;font-family:'Cinzel',serif;
  letter-spacing:.1em;
  transition:all .3s;
  text-shadow:0 0 5px rgba(0,0,0,.3);
}
.r-tag:hover{
  border-color:var(--horror-red);
  background:rgba(200,15,15,.2);
  color:var(--horror-red);
  box-shadow:0 0 15px rgba(200,0,0,.2);
}
.r-advice{
  background:rgba(6,0,8,.9);border:1.5px solid #2a0808;
  border-radius:6px;padding:1.6rem 1.8rem;margin-bottom:2rem;
  box-shadow:0 0 30px rgba(140,0,0,.15);
}
.r-advice-lbl{font-size:.65rem;color:#6a3030;letter-spacing:.3em;margin-bottom:.8rem;font-family:'Cinzel',serif;text-transform:uppercase;text-shadow:0 0 8px rgba(200,0,0,.15);}

const audioContext = new (window.AudioContext || window.webkitAudioContext)();

// Create subtle horror ambient sound (sine wave with modulation)
function playHorrorTone(frequency = 40, duration = 0.3) {
  try {
    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    
    osc.connect(gain);
    gain.connect(audioContext.destination);
    
    osc.frequency.value = frequency;
    osc.type = 'sine';
    
    gain.gain.setValueAtTime(0.02, now);
    gain.gain.linearRampToValueAtTime(0, now + duration);
    
    osc.start(now);
    osc.stop(now + duration);
  } catch(e) {}
}

// Click sound effect
function playClickSound() {
  try {
    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    
    osc.connect(gain);
    gain.connect(audioContext.destination);
    
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
    
    gain.gain.setValueAtTime(0.03, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.15);
    
    osc.start(now);

let cur = 0;
let answers = new Array(QS.length).fill(null);

const ROMAN = ["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ","Ⅸ","Ⅹ"];

function startQuiz(){
  cur = 0;
  answers = new Array(QS.length).fill(null);
  playHorrorTone(50, 0.4);
  document.getElementById('landing').classList.remove('active');
  const qs = document.getElementById('quiz-section');
  qs.classList.add('active');
  render();
  window.addEventListener('scroll', onScroll);
}

function onScroll(){
  const tb = document.getElementById('topbar');
  if(window.scrollY > 80) tb.classList.add('visible');
  else tb.classList.remove('visible');
}

function goHome(){
  playClickSound();
  document.getElementById('quiz-section').classList.remove('active');
  document.getElementById('landing').classList.add('active');
  document.getElementById('topbar').classList.remove('visible');
  window.removeEventListener('scroll', onScroll);
  document.getElementById('rcard').style.display='none';
  document.getElementById('qcard').style.display='block';
  document.querySelector('#quiz-section .nav').style.display='flex';
}

function render(){
  const q = QS[cur];
  document.getElementById('step-lbl').textContent = `問題 ${cur+1} / ${QS.length}`;
  document.getElementById('prog-fill').style.width = ((cur+1)/QS.length*100)+'%';
  document.getElementById('qnum').textContent = `QUESTION ${ROMAN[cur]}`;
  document.getElementById('qtext').textContent = q.q;
  const opts = document.getElementById('opts');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className='opt'+(answers[cur]===i?' sel':'');
    b.innerHTML=`<span class="osym">${ROMAN[i]}</span>${o.t}`;
    b.onclick=()=>{ 
      answers[cur]=i; 
      playClickSound();
      b.classList.add('horror-shake');
      setTimeout(()=>b.classList.remove('horror-shake'),300);
      render(); 
    };
    opts.appendChild(b);
  });
  document.getElementById('pbtn').disabled = cur===0;
  document.getElementById('nbtn').textContent = cur===QS.length-1 ? '窺見深淵 →' : '繼續 →';
}

function nextQ(){
  if(answers[cur]===null) return;
  playClickSound();
  if(cur < QS.length-1){ cur++; render(); }
  else { playHorrorTone(60, 0.5); showResult(); }
}
function prevQ(){ if(cur>0){ cur--; playClickSound(); render(); }}

function showResult(){
  const scores = {control:0, attach:0, exist:0, worth:0, detach:0};
  QS.forEach((q,qi)=>{
    if(answers[qi]===null) return;
    scores[q.opts[answers[qi]].v]++;
  });
  const winner = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
  const total = Object.values(scores).reduce((a,b)=>a+b,0);
  const pct = Math.round(scores[winner]/total*100);
  const r = TYPES[winner];

  document.getElementById('qcard').style.display='none';
  document.querySelector('#quiz-section .nav').style.display='none';
  const rc = document.getElementById('rcard');
  rc.style.display='block';

  document.getElementById('r-icon').textContent = r.icon;
  document.getElementById('r-type').textContent = r.label;
  document.getElementById('r-name').textContent = r.name;
  document.getElementById('r-score-pct').textContent = pct+'%';
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-tags').innerHTML = r.tags.map(t=>`<span class="r-tag">${t}</span>`).join('');
  document.getElementById('r-advice').textContent = r.advice;
  
  setTimeout(()=>{ document.getElementById('r-score-bar').style.width = pct+'%'; },100);
  setTimeout(()=>{ playHorrorTone(45, 0.6); },800);
}

function restartQuiz(){
  cur=0; 
  answers=new Array(QS.length).fill(null);
  playClickSound();
  document.getElementById('rcard').style.display='none';
  document.getElementById('qcard').style.display='block';
  document.querySelector('#quiz-section .nav').style.display='flex';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
